set -g mouse on

# Use vi-style key bindings in copy mode
setw -g mode-keys vi

# Remap copy mode keys to mimic Vim and sync with Ubuntu clipboard
# install xclip
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe "xclip -se clipboard -i"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -se clipboard -i"

set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
